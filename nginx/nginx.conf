worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Скрываем версию nginx
    server_tokens off;

    # Общие security-заголовки
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;

    # Таймауты
    client_body_timeout 15;
    client_header_timeout 15;
    keepalive_timeout 65;
    send_timeout 15;

    # Размер тела запроса (куки + конфиги)
    client_max_body_size 2m;

    # ── HTTP → HTTPS редирект ──────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # Замените пути на свои сертификаты (Let's Encrypt / самоподписанные)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Современные протоколы
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS — включить только после проверки, что HTTPS работает стабильно
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # ── Обычные HTTP-запросы ───────────────────────────────────
        location / {
            proxy_pass http://hh-bot:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60;
            proxy_connect_timeout 10;
        }

        # ── WebSocket ──────────────────────────────────────────────
        location /ws {
            proxy_pass http://hh-bot:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400;
        }
    }
}
